name: Aktualizacia Kalendara

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Stiahnutie kódu
        uses: actions/checkout@v4

      - name: Nastavenie Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Inštalácia knižníc
        run: |
          pip install requests beautifulsoup4 ics

      - name: Spustenie scrapera
        run: python scraper.py

      - name: Uloženie a publikovanie sdetmi.ics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Automatická aktualizácia kalendára" || exit 0
          git push
